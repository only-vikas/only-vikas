<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Animated cyberpunk grid</title>
  <desc id="desc">A dark navy grid with subtle pulsing cyan and magenta neon glows.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050816" />
      <stop offset="1" stop-color="#0a1024" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00F5FF" stroke-opacity="0.13" stroke-width="1" />
    </pattern>
    <radialGradient id="cyanGlow">
      <stop stop-color="#00F5FF" stop-opacity="0.22" />
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="magentaGlow">
      <stop stop-color="#FF00E5" stop-opacity="0.16" />
      <stop offset="1" stop-color="#FF00E5" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#background)" />
  <rect width="1200" height="300" fill="url(#grid)" />
  <ellipse cx="250" cy="120" rx="300" ry="190" fill="url(#cyanGlow)">
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="7s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="970" cy="220" rx="280" ry="180" fill="url(#magentaGlow)">
    <animate attributeName="opacity" values="0.45;0.8;0.45" dur="9s" repeatCount="indefinite" />
  </ellipse>
  <path d="M0 228 Q300 168 600 218 T1200 190" fill="none" stroke="#00F5FF" stroke-opacity="0.45" stroke-width="1.5" filter="url(#softGlow)">
    <animate attributeName="stroke-opacity" values="0.25;0.55;0.25" dur="6s" repeatCount="indefinite" />
  </path>
  <path d="M0 76 Q320 128 650 70 T1200 102" fill="none" stroke="#FF00E5" stroke-opacity="0.28" stroke-width="1" />
  <rect x="12" y="12" width="1176" height="276" rx="12" fill="none" stroke="#00F5FF" stroke-opacity="0.32" />
</svg>
